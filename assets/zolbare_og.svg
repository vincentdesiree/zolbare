<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Fond sombre -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Halos lumineux -->
  <circle cx="1000" cy="150" r="250" fill="#6366f1" opacity="0.2" filter="url(#blur-glow)" />
  <circle cx="200" cy="500" r="200" fill="#a855f7" opacity="0.15" filter="url(#blur-glow)" />

  <!-- Contenu -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#accent)" opacity="0.2" />
    <rect x="0" y="0" width="160" height="36" rx="18" stroke="url(#accent)" stroke-width="1" fill="none" />
    <text x="80" y="23" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1.5">ZOLA THEME</text>

    <!-- Titre -->
    <text x="0" y="120" fill="#ffffff" font-family="sans-serif" font-size="72" font-weight="bold">Zolbare</text>

    <!-- Barre accent -->
    <rect x="0" y="150" width="120" height="6" rx="3" fill="url(#accent)" />

    <!-- Description -->
    <text x="0" y="210" fill="#94a3b8" font-family="sans-serif" font-size="28">A lightweight, no-bloat Zola theme focused on content.</text>

    <!-- Badges -->
    <text x="0" y="270" fill="#64748b" font-family="monospace" font-size="20">Zero JS  •  Vanilla CSS</text>
  </g>
</svg>
